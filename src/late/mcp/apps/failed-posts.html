<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Zernio failed posts</title>
<style>/*ZERNIO_CSS*/
.post { padding: 10px 0; align-items: flex-start; }
.post:first-child { padding-top: 0; }
.post:last-child { padding-bottom: 0; }
.post .text { -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.post .error { color: var(--z-danger); font-size: 12px; -webkit-line-clamp: 2; }
.post .state { font-size: 12px; white-space: nowrap; }
</style>
</head>
<body>
<main id="app" class="card" aria-live="polite">
  <div class="skeleton" aria-busy="true" aria-label="Loading failed posts"><i style="width:30%"></i><i></i><i style="width:80%"></i><i></i></div>
</main>
<script>/*ZERNIO_RUNTIME*/</script>
<script>
(function () {
  var Z = window.Zernio, el = Z.el;
  var app = document.getElementById("app");
  var posts = [];
  // post id -> "busy" | {ok, text}
  var retried = {};

  function retry(post) {
    retried[post.id] = "busy";
    render();
    Z.callTool("posts_retry", { post_id: post.id }).then(function (result) {
      var text = Z.text(result);
      retried[post.id] = { ok: !result.isError && text.indexOf("✅") === 0, text: text };
    }, function (err) {
      retried[post.id] = { ok: false, text: err.message };
    }).then(function () {
      render();
      var done = posts.filter(function (p) { return retried[p.id] && retried[p.id].ok; });
      if (done.length) {
        Z.tellModel("From the Zernio failed-posts card the user queued " + done.length + " post(s) for retry: " +
          done.map(function (p) { return p.id; }).join(", ")).catch(function () {});
      }
    });
  }

  function row(post) {
    var outcome = retried[post.id];
    var errors = post.errors || [];
    var action;
    if (outcome === "busy") action = el("button", { class: "btn small", disabled: true }, "Retrying…");
    else if (outcome && outcome.ok) action = el("span", { class: "state", style: "color: var(--z-success)", text: "Queued" });
    else action = el("button", { class: "btn small", onclick: function () { retry(post); }, "aria-label": "Retry post " + post.id }, "Retry");

    return el("div", { class: "row post" },
      el("div", { class: "grow" },
        el("div", { class: "text clamp", text: post.content || "(no text)" }),
        el("div", { class: "small" }, (post.platforms || []).map(Z.platformName).join(", ")),
        errors.length
          ? el("div", { class: "error clamp", text: errors.map(function (e) { return Z.platformName(e.platform) + ": " + e.message; }).join(" · ") })
          : el("div", { class: "error", text: "No error message recorded" }),
        outcome && outcome !== "busy" && !outcome.ok ? el("div", { class: "error", text: outcome.text }) : null),
      action);
  }

  function render() {
    if (!posts.length) {
      app.replaceChildren(
        el("p", { class: "eyebrow" }, el("span", { class: "mark" }), "Failed posts"),
        el("div", { class: "row" }, el("span", { class: "dot ok" }), "No failed posts. Everything published."));
      return;
    }
    app.replaceChildren(
      el("p", { class: "eyebrow" }, el("span", { class: "mark" }), "Failed posts · " + posts.length),
      el("div", { class: "divided" }, posts.map(row)));
  }

  Z.on("result", function (result) {
    var data = Z.data(result);
    if (result.isError || !data || !Array.isArray(data.posts)) {
      app.replaceChildren(el("div", { class: "notice bad", text: Z.text(result) || "Could not load failed posts." }));
      return;
    }
    posts = data.posts;
    render();
  });
  Z.connect({ name: "failed posts" });
})();
</script>
</body>
</html>
