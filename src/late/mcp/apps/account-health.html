<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Zernio account health</title>
<style>/*ZERNIO_CSS*/
.counts { display: flex; gap: 16px; margin-bottom: 10px; }
.count .value { font-size: 18px; font-weight: 600; }
.account { padding: 8px 0; align-items: flex-start; }
.account:first-child { padding-top: 0; }
.account .dot { margin-top: 7px; }
.account .issue { font-size: 12px; color: var(--z-text-2); -webkit-line-clamp: 2; }
</style>
</head>
<body>
<main id="app" class="card" aria-live="polite">
  <div class="skeleton" aria-busy="true" aria-label="Loading account health"><i style="width:30%"></i><i style="width:60%"></i><i></i><i></i></div>
</main>
<script>/*ZERNIO_RUNTIME*/</script>
<script>
(function () {
  var Z = window.Zernio, el = Z.el;
  var app = document.getElementById("app");
  var SHOWN = 6;
  var RANK = { error: 0, warning: 1, healthy: 2 };
  var DOT = { error: "bad", warning: "warn", healthy: "ok" };

  function issueOf(account) {
    if (account.needsReconnect) return account.disconnectReason || "Needs to be reconnected";
    return (account.issues || [])[0] || account.disconnectReason || "";
  }

  function render(data) {
    var accounts = (data.accounts || []).slice().sort(function (a, b) {
      return (RANK[a.status] != null ? RANK[a.status] : 3) - (RANK[b.status] != null ? RANK[b.status] : 3);
    });
    var summary = data.summary || {};
    var total = summary.total != null ? summary.total : accounts.length;
    var unhealthy = accounts.filter(function (a) { return a.status !== "healthy"; });
    var shown = unhealthy.slice(0, SHOWN);
    var hidden = accounts.length - shown.length;
    var reconnect = summary.needsReconnect || accounts.filter(function (a) { return a.needsReconnect; }).length;

    function count(label, value, dot) {
      return el("div", { class: "count" },
        el("div", { class: "row small" }, el("span", { class: "dot " + dot }), label),
        el("div", { class: "value num", text: String(value || 0) }));
    }

    app.replaceChildren(
      el("p", { class: "eyebrow" }, el("span", { class: "mark" }), "Account health · " + total + (total === 1 ? " account" : " accounts")),
      el("div", { class: "counts" },
        count("Healthy", summary.healthy, "ok"),
        count("Warning", summary.warning, "warn"),
        count("Error", summary.error, "bad")),
      unhealthy.length
        ? el("div", { class: "divided" }, shown.map(function (a) {
          return el("div", { class: "row account" },
            el("span", { class: "dot " + (DOT[a.status] || "") }),
            el("div", { class: "grow" },
              el("div", null, Z.platformName(a.platform) + " ", el("span", { class: "small", text: a.username ? "@" + a.username : a.displayName || a.accountId })),
              issueOf(a) ? el("div", { class: "issue clamp", text: issueOf(a) }) : null));
        }))
        : el("div", { class: "notice ok", text: "Every account can post." }),
      hidden > 0 ? el("div", { class: "small", style: "margin-top: 8px", text: hidden + " more " + (unhealthy.length > SHOWN ? "accounts" : "healthy accounts") + " not shown" }) : null,
      reconnect ? el("div", { class: "actions" },
        el("button", { class: "btn primary", onclick: function () { Z.openLink("https://zernio.com/dashboard"); } },
          "Reconnect " + reconnect + (reconnect === 1 ? " account" : " accounts"))) : null);
  }

  Z.on("result", function (result) {
    var data = Z.data(result);
    if (result.isError || !data || !Array.isArray(data.accounts)) {
      app.replaceChildren(el("div", { class: "notice bad", text: Z.text(result) || "Could not load account health." }));
      return;
    }
    render(data);
  });
  Z.connect({ name: "account health" });
})();
</script>
</body>
</html>
